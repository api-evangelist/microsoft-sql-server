specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Microsoft SQL Server
providerId: microsoft-sql-server
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Cloud
  - Data Management
  - Database
  - Enterprise
  - Relational Database
  - SQL
  - Rate Limiting
  - Quotas
  - Throttling
description: Machine-readable rate limit definitions for the Microsoft SQL Server API surface. Captures
  per-tier quotas, burst behavior, response signaling, and recovery semantics. Defaults are scaffold values
  to be replaced with published provider limits.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retryAfter: Retry-After
  policy: RateLimit-Policy
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: free
    name: Free Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 10
    burst: 20
    timeFrame: minute
    applies:
      - SQL Server Database Engine API
      - SQL Server Management Objects (SMO) API
      - Azure SQL Database REST API
      - SQL Server Reporting Services (SSRS) API
      - SQL Server Integration Services (SSIS) Catalog API
      - Azure SQL Managed Instance REST API
      - Data API Builder
      - Azure Analysis Services REST API
      - Microsoft SqlClient Data Provider (ADO.NET)
      - Microsoft JDBC Driver for SQL Server
      - Microsoft ODBC Driver for SQL Server
      - Microsoft OLE DB Driver for SQL Server
      - Microsoft Python Driver for SQL Server (mssql-python)
      - Node.js Driver for SQL Server (tedious)
  - tier: free
    name: Free Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 1000
    timeFrame: month
    applies:
      - SQL Server Database Engine API
      - SQL Server Management Objects (SMO) API
      - Azure SQL Database REST API
      - SQL Server Reporting Services (SSRS) API
      - SQL Server Integration Services (SSIS) Catalog API
      - Azure SQL Managed Instance REST API
      - Data API Builder
      - Azure Analysis Services REST API
      - Microsoft SqlClient Data Provider (ADO.NET)
      - Microsoft JDBC Driver for SQL Server
      - Microsoft ODBC Driver for SQL Server
      - Microsoft OLE DB Driver for SQL Server
      - Microsoft Python Driver for SQL Server (mssql-python)
      - Node.js Driver for SQL Server (tedious)
  - tier: professional
    name: Professional Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 100
    burst: 200
    timeFrame: minute
    applies:
      - SQL Server Database Engine API
      - SQL Server Management Objects (SMO) API
      - Azure SQL Database REST API
      - SQL Server Reporting Services (SSRS) API
      - SQL Server Integration Services (SSIS) Catalog API
      - Azure SQL Managed Instance REST API
      - Data API Builder
      - Azure Analysis Services REST API
      - Microsoft SqlClient Data Provider (ADO.NET)
      - Microsoft JDBC Driver for SQL Server
      - Microsoft ODBC Driver for SQL Server
      - Microsoft OLE DB Driver for SQL Server
      - Microsoft Python Driver for SQL Server (mssql-python)
      - Node.js Driver for SQL Server (tedious)
  - tier: professional
    name: Professional Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 100000
    timeFrame: month
    applies:
      - SQL Server Database Engine API
      - SQL Server Management Objects (SMO) API
      - Azure SQL Database REST API
      - SQL Server Reporting Services (SSRS) API
      - SQL Server Integration Services (SSIS) Catalog API
      - Azure SQL Managed Instance REST API
      - Data API Builder
      - Azure Analysis Services REST API
      - Microsoft SqlClient Data Provider (ADO.NET)
      - Microsoft JDBC Driver for SQL Server
      - Microsoft ODBC Driver for SQL Server
      - Microsoft OLE DB Driver for SQL Server
      - Microsoft Python Driver for SQL Server (mssql-python)
      - Node.js Driver for SQL Server (tedious)
  - tier: enterprise
    name: Enterprise Negotiated Limit
    scope: contract
    metric: requests_per_minute
    limit: 1000
    burst: 5000
    timeFrame: minute
    applies:
      - SQL Server Database Engine API
      - SQL Server Management Objects (SMO) API
      - Azure SQL Database REST API
      - SQL Server Reporting Services (SSRS) API
      - SQL Server Integration Services (SSIS) Catalog API
      - Azure SQL Managed Instance REST API
      - Data API Builder
      - Azure Analysis Services REST API
      - Microsoft SqlClient Data Provider (ADO.NET)
      - Microsoft JDBC Driver for SQL Server
      - Microsoft ODBC Driver for SQL Server
      - Microsoft OLE DB Driver for SQL Server
      - Microsoft Python Driver for SQL Server (mssql-python)
      - Node.js Driver for SQL Server (tedious)
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter, honoring the Retry-After header
      when present.
  - name: Burst Handling
    description: Short bursts above the steady-state limit are tolerated up to the documented burst ceiling
      before throttling engages.
  - name: Quota Reset
    description: Monthly quotas reset at the start of each calendar month in UTC. Per-minute and per-second
      windows reset on a sliding-window basis.
  - name: Fair Use
    description: Even on uncapped enterprise tiers, sustained usage that materially impacts shared infrastructure
      may be subject to fair-use throttling.
maintainers:
